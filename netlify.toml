[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions (serverless): guía RaidDominion + scheduled de Discord.
# Las funciones NO usan @supabase/supabase-js (REST directo), así que no hace
# falta external_node_modules.
[functions]
  node_bundler = "esbuild"

# Portal de hermandad: raíz legacy /:slug → portal canónico /hermandad/:slug
# (los archivos reales tienen prioridad; /guilds y demás específicos también)
[[redirects]]
  from = "/:slug"
  to = "/hermandad/:slug"
  status = 301

# Shell del portal de hermandad: /hermandad/:slug → /hermandad (el navegador
# conserva la URL real y el script resuelve el slug)
[[redirects]]
  from = "/hermandad/*"
  to = "/hermandad"
  status = 200

# Ficha pública POR PERSONAJE /personaje/:slug → shell /personaje
# (el navegador conserva la URL real; CharacterView resuelve el slug)
[[redirects]]
  from = "/personaje/*"
  to = "/personaje"
  status = 200

# Perfil de jugador canónico /jugador/:slug → shell de jugador
[[redirects]]
  from = "/jugador/*"
  to = "/jugador"
  status = 200

# Ficha de servidor y reino anidado → shell /servidor
# (ServerView/RealmView se auto-activan por segmentos)
[[redirects]]
  from = "/servidor/*"
  to = "/servidor"
  status = 200

# Ficha pública DE BANDA /banda/:slug → shell /banda
[[redirects]]
  from = "/banda/*"
  to = "/banda"
  status = 200

# Alias de directorios: /guilds (legacy) → /hermandades (canónico)
[[redirects]]
  from = "/guilds"
  to = "/hermandades"
  status = 301

# Chat con IA: ruta amigable hacia la Netlify Function (antes del SPA catch-all)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Discord: envío manual desde el panel admin hacia la Netlify Function
[[redirects]]
  from = "/api/discord-send"
  to = "/.netlify/functions/discord-send"
  status = 200

# Visitas: el beacon del Layout envía las visitas a las secciones (registro
# en raiddominion_visits + aviso al canal admin de Discord)
[[redirects]]
  from = "/api/visit"
  to = "/.netlify/functions/visit"
  status = 200

# Redirecciones SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configuración de encabezados de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Caché para assets estáticos
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"