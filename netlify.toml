[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Portal de hermandad en raíz /:slug (los archivos reales tienen prioridad)
[[redirects]]
  from = "/:slug"
  to = "/portal"
  status = 200

# Ficha pública POR PERSONAJE /personaje/:slug y compat de /p/:slug
# (los archivos reales tienen prioridad; ambas sirven el shell /personaje)
[[redirects]]
  from = "/personaje/*"
  to = "/personaje"
  status = 200

[[redirects]]
  from = "/p/*"
  to = "/personaje"
  status = 200

# Redirecciones SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configuración de encabezados de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Caché para assets estáticos
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"